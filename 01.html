<!DOCTYPE html>
<html lang="en">
<head>
    <title>Log in page </title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color:  #1a1a1a;
            margin:0;
            padding:0;
            height:100vh;
            display:flex;
            justify-content: center;
            align-items:center;
        }
        .card{
            background-color: #d5d4d4 ;
            border-radius: 8px;
            padding: 30px;
            width:300px;

        }
        h2{
            color:#1a5aa0;
            text-align: center0;
            margin-bottom: 20px;
        }
        form{
            display:flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" name="" id="" placeholder="email">
            <input type="password" placeholder="password">
            <button type="submit"></button>
           </form>
    </div>
</body>
</html>
